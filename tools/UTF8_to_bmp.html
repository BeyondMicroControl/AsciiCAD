<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>char_to_bmp (client-side)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
    label { display: block; font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
    input, textarea, button { font: inherit; }
    textarea { width: 520px; height: 72px; padding: 8px; }
    button { padding: 10px 12px; }
    canvas { border: 1px solid #ccc; image-rendering: pixelated; }
    .muted { opacity: 0.75; font-size: 12px; line-height: 1.35; }
    .ok { color: #0a7; }
    .err { color: #c33; }

    .control {
      min-width: 240px;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    .control .topline {
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .control .value {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      opacity: 0.85;
      white-space: nowrap;
    }
    .control input[type="range"] { width: 100%; }
    .check {
      display:flex; align-items:center; gap:8px;
      padding: 8px 10px; border: 1px solid #ddd; border-radius: 10px;
      background:#fff;
    }
    .check label { margin: 0; opacity: 1; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Render one Unicode character → 1-bit BMP</h2>

  <div class="row">
    <div>
      <label>Character (exactly 1 code point)</label>
      <input id="charInput" type="text" value="A" maxlength="4" style="padding:8px; width:220px;" />
    </div>

    <div class="control">
      <div class="topline">
        <label>Bitmap size (px)</label>
        <div class="value" id="sizeVal"></div>
      </div>
      <input id="sizeInput" type="range" min="8" max="512" step="1" value="64" />
    </div>

    <div class="control">
      <div class="topline">
        <label>Font size (px)</label>
        <div class="value" id="fontSizeVal"></div>
      </div>
      <input id="fontSizeInput" type="range" min="4" max="256" step="1" value="48" />
    </div>

    <div class="control">
      <div class="topline">
        <label>Threshold (0–255)</label>
        <div class="value" id="thresholdVal"></div>
      </div>
      <input id="thresholdInput" type="range" min="0" max="255" step="1" value="128" />
    </div>
  </div>

  <div class="row" style="margin-top: 14px;">
    <div class="control">
      <div class="topline">
        <label>width % (1–400)</label>
        <div class="value" id="widthPctVal"></div>
      </div>
      <input id="widthPctInput" type="range" min="1" max="400" step="1" value="100" />
    </div>

    <div class="control">
      <div class="topline">
        <label>height % (1–400)</label>
        <div class="value" id="heightPctVal"></div>
      </div>
      <input id="heightPctInput" type="range" min="1" max="400" step="1" value="100" />
    </div>

    <div class="control">
      <div class="topline">
        <label>offsetX (px)</label>
        <div class="value" id="offsetXVal"></div>
      </div>
      <input id="offsetXInput" type="range" min="-256" max="256" step="1" value="0" />
    </div>

    <div class="control">
      <div class="topline">
        <label>offsetY (px)</label>
        <div class="value" id="offsetYVal"></div>
      </div>
      <input id="offsetYInput" type="range" min="-256" max="256" step="1" value="0" />
    </div>

    <div class="control">
      <div class="topline">
        <label>rotation (° 0–360)</label>
        <div class="value" id="rotationVal"></div>
      </div>
      <input id="rotationInput" type="range" min="0" max="360" step="1" value="0" />
    </div>

    <div class="check" title="Mirror left/right">
      <input id="flipHInput" type="checkbox" />
      <label for="flipHInput">Horizontal flip</label>
    </div>
    <div class="check" title="Mirror up/down">
      <input id="flipVInput" type="checkbox" />
      <label for="flipVInput">Vertical flip</label>
    </div>
  </div>

  <div style="margin-top: 14px;">
    <label>Font fallback chain (CSS font-family list; earlier = higher priority)</label>
    <textarea id="fontListInput">"Noto Sans Mono","Menlo","Euphemia UCAS","Arial Unicode MS",monospace</textarea>
    <div class="muted">
      Preview updates live on any parameter change.
      Download uses a best-effort font selection (browsers do not expose glyph-index APIs).
    </div>
  </div>

  <div class="row" style="margin-top: 14px;">
    <button id="downloadBtn">Download BMP</button>
    <div id="status" class="muted"></div>
  </div>

  <div class="row" style="margin-top: 18px;">
    <div>
      <label>Preview (thresholded 1-bit look)</label>
      <canvas id="previewCanvas" width="256" height="256"></canvas>
      <div class="muted">This preview scales the bitmap up for visibility.</div>
    </div>
    <div>
      <label>Internal render (exact size)</label>
      <canvas id="workCanvas" width="64" height="64" style="width:256px;height:256px;"></canvas>
      <div class="muted">This is the actual working canvas (scaled up via CSS).</div>
    </div>
  </div>

<script>
/* Live-preview version:
 * - All numeric params are range sliders.
 * - Any change triggers a re-render (debounced).
 * - Flip is applied first in the transform pipeline.
 */

// ---------- Utilities ----------
function setStatus(msg, cls="muted") {
  const el = document.getElementById("status");
  el.className = cls;
  el.textContent = msg;
}

function getSingleCodePoint(str) {
  const s = str ?? "";
  const cps = Array.from(s);
  if (cps.length !== 1) throw new Error(`Expected exactly 1 Unicode code point; got ${cps.length}.`);
  return cps[0];
}

function hexCodePoint(ch) {
  const cp = ch.codePointAt(0);
  return "0x" + cp.toString(16).toUpperCase().padStart(4, "0");
}

function degToRad(deg) { return (deg * Math.PI) / 180; }

// ---------- Slider UI plumbing ----------
function bindSliderValue(sliderId, valueId, suffix="") {
  const s = document.getElementById(sliderId);
  const v = document.getElementById(valueId);
  const update = () => v.textContent = `${s.value}${suffix}`;
  s.addEventListener("input", update);
  update();
}

bindSliderValue("sizeInput", "sizeVal", " px");
bindSliderValue("fontSizeInput", "fontSizeVal", " px");
bindSliderValue("thresholdInput", "thresholdVal", "");
bindSliderValue("widthPctInput", "widthPctVal", " %");
bindSliderValue("heightPctInput", "heightPctVal", " %");
bindSliderValue("offsetXInput", "offsetXVal", " px");
bindSliderValue("offsetYInput", "offsetYVal", " px");
bindSliderValue("rotationInput", "rotationVal", " °");

// Make offset ranges adapt when bitmap size changes
function updateOffsetRanges() {
  const size = Number(document.getElementById("sizeInput").value);
  const span = Math.max(16, Math.floor(size * 2)); // generous
  for (const id of ["offsetXInput","offsetYInput"]) {
    const el = document.getElementById(id);
    el.min = String(-span);
    el.max = String(span);
    // keep value in range
    const val = Number(el.value);
    if (val < -span) el.value = String(-span);
    if (val >  span) el.value = String(span);
  }
  document.getElementById("offsetXVal").textContent = `${document.getElementById("offsetXInput").value} px`;
  document.getElementById("offsetYVal").textContent = `${document.getElementById("offsetYInput").value} px`;
}

// ---------- Read params ----------
function readParams() {
  const size = Number(document.getElementById("sizeInput").value);
  const fontSize = Number(document.getElementById("fontSizeInput").value);
  const threshold = Number(document.getElementById("thresholdInput").value);

  const widthPct  = Number(document.getElementById("widthPctInput").value);
  const heightPct = Number(document.getElementById("heightPctInput").value);
  const offsetX   = Number(document.getElementById("offsetXInput").value);
  const offsetY   = Number(document.getElementById("offsetYInput").value);
  const rotation  = Number(document.getElementById("rotationInput").value);

  const flipH = document.getElementById("flipHInput").checked;
  const flipV = document.getElementById("flipVInput").checked;

  const ch = getSingleCodePoint(document.getElementById("charInput").value);
  const fontListStr = document.getElementById("fontListInput").value;

  return {
    ch, size, fontSize, threshold, fontListStr,
    raster: { widthPct, heightPct, offsetX, offsetY, rotation, flipH, flipV }
  };
}

// ---------- Rendering + transforms ----------
function renderGlyphToCanvas(ctx, ch, size, fontSize, fontFamily, raster) {
  const { widthPct, heightPct, offsetX, offsetY, rotation, flipH, flipV } = raster;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, size, size);

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = "#000";
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";
  ctx.font = `${fontSize}px ${fontFamily}`;

  const m = ctx.measureText(ch);
  const L = (m.actualBoundingBoxLeft ?? 0);
  const R = (m.actualBoundingBoxRight ?? m.width ?? 0);
  const A = (m.actualBoundingBoxAscent ?? fontSize * 0.8);
  const D = (m.actualBoundingBoxDescent ?? fontSize * 0.2);

  const centerX = (R - L) / 2;
  const centerY = (D - A) / 2;

  const x0 = -centerX;
  const y0 = -centerY;

  const sx = widthPct / 100;
  const sy = heightPct / 100;
  const ang = degToRad(rotation);

  // Flip first in the pipeline => call flip LAST.
  const fx = flipH ? -1 : 1;
  const fy = flipV ? -1 : 1;

  ctx.save();
  ctx.translate(size / 2 + offsetX, size / 2 + offsetY);
  ctx.rotate(ang);
  ctx.scale(sx, sy);
  ctx.scale(fx, fy); // flip first (rightmost)
  ctx.fillText(ch, x0, y0);
  ctx.restore();
}

// ---------- Threshold to 1-bit ----------
function thresholdCanvasToBitMatrix(ctx, size, threshold) {
  const rgba = ctx.getImageData(0, 0, size, size).data;
  const bits = new Uint8Array(size * size);
  for (let i = 0; i < size * size; i++) {
    const r = rgba[i*4], g = rgba[i*4+1], b = rgba[i*4+2], a = rgba[i*4+3];
    const lum = (a === 0) ? 255 : Math.round(0.2126*r + 0.7152*g + 0.0722*b);
    bits[i] = (lum >= threshold) ? 1 : 0;
  }
  return bits;
}

// ---------- Preview ----------
function drawPreview(bitMatrix, size, previewCanvas) {
  const pctx = previewCanvas.getContext("2d");
  const scale = Math.max(1, Math.floor(previewCanvas.width / size));

  pctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  pctx.fillStyle = "#fff";
  pctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

  pctx.fillStyle = "#000";
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (bitMatrix[y * size + x] === 0) pctx.fillRect(x * scale, y * scale, scale, scale);
    }
  }
}

// ---------- Font selection (best-effort) ----------
function parseFontList(fontListStr) {
  const parts = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < fontListStr.length; i++) {
    const c = fontListStr[i];
    if (c === '"') inQuotes = !inQuotes;
    if (c === "," && !inQuotes) { parts.push(cur.trim()); cur = ""; }
    else cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts.filter(Boolean);
}

function normalizeFamilyToken(t) {
  const s = t.trim();
  if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
  return s;
}

function computeInkBBoxFromRGBA(rgba, w, h) {
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = rgba[i], g = rgba[i+1], b = rgba[i+2], a = rgba[i+3];
      if (a === 0) continue;
      if (r < 250 || g < 250 || b < 250) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX || maxY < minY) return null;
  return {minX, minY, maxX, maxY};
}

function getCanvasRGBA(ctx, size) {
  return ctx.getImageData(0, 0, size, size).data;
}

async function fontSeemsToHaveGlyph(ctx, ch, size, fontSize, familyToken, raster) {
  const fam = normalizeFamilyToken(familyToken);

  try {
    if (document.fonts && document.fonts.check) {
      const ok = document.fonts.check(`${fontSize}px "${fam}"`, ch);
      if (!ok) return false;
    }
  } catch {}

  const fontFamilySingle = `"${fam}"`;

  renderGlyphToCanvas(ctx, ch, size, fontSize, fontFamilySingle, raster);
  const a = getCanvasRGBA(ctx, size);
  if (!computeInkBBoxFromRGBA(a, size, size)) return false;

  renderGlyphToCanvas(ctx, "\uFFFD", size, fontSize, fontFamilySingle, raster);
  const b = getCanvasRGBA(ctx, size);

  function sig(rgba) {
    let s = 0;
    const step = Math.max(1, Math.floor(size / 32));
    for (let y = 0; y < size; y += step) {
      for (let x = 0; x < size; x += step) {
        const i = (y * size + x) * 4;
        const r = rgba[i], g = rgba[i+1], bb = rgba[i+2], aa = rgba[i+3];
        const ink = (aa !== 0 && (r < 240 || g < 240 || bb < 240)) ? 1 : 0;
        s = (s * 131 + ink) >>> 0;
      }
    }
    return s >>> 0;
  }

  return sig(a) !== sig(b);
}

async function pickFontFamilyChainForChar(ctx, ch, size, fontSize, fontListStr, raster) {
  const tokens = parseFontList(fontListStr);
  for (const t of tokens) {
    if (await fontSeemsToHaveGlyph(ctx, ch, size, fontSize, t, raster)) {
      const normalized = tokens.map(x => x.trim());
      const idx = normalized.indexOf(t);
      const chain = [...normalized.slice(idx), ...normalized.slice(0, idx)].join(",");
      return { chosen: normalizeFamilyToken(t), chain };
    }
  }
  // fallback: use whatever chain user gave (browser will fallback anyway)
  return { chosen: "(browser fallback)", chain: fontListStr };
}

// ---------- BMP encoder (1bpp) ----------
function encodeBMP1bpp(bits, width, height) {
  const rowBytesUnpadded = Math.ceil(width / 8);
  const rowBytesPadded = (rowBytesUnpadded + 3) & ~3;
  const pixelArraySize = rowBytesPadded * height;

  const fileHeaderSize = 14, dibHeaderSize = 40, paletteSize = 8;
  const pixelDataOffset = fileHeaderSize + dibHeaderSize + paletteSize;
  const fileSize = pixelDataOffset + pixelArraySize;

  const buf = new ArrayBuffer(fileSize);
  const dv = new DataView(buf);
  let p = 0;

  dv.setUint8(p++, 0x42); dv.setUint8(p++, 0x4D);
  dv.setUint32(p, fileSize, true); p += 4;
  dv.setUint16(p, 0, true); p += 2;
  dv.setUint16(p, 0, true); p += 2;
  dv.setUint32(p, pixelDataOffset, true); p += 4;

  dv.setUint32(p, dibHeaderSize, true); p += 4;
  dv.setInt32(p, width, true); p += 4;
  dv.setInt32(p, height, true); p += 4;
  dv.setUint16(p, 1, true); p += 2;
  dv.setUint16(p, 1, true); p += 2;
  dv.setUint32(p, 0, true); p += 4;
  dv.setUint32(p, pixelArraySize, true); p += 4;
  dv.setInt32(p, 2835, true); p += 4;
  dv.setInt32(p, 2835, true); p += 4;
  dv.setUint32(p, 2, true); p += 4;
  dv.setUint32(p, 0, true); p += 4;

  dv.setUint8(p++, 0x00); dv.setUint8(p++, 0x00); dv.setUint8(p++, 0x00); dv.setUint8(p++, 0x00);
  dv.setUint8(p++, 0xFF); dv.setUint8(p++, 0xFF); dv.setUint8(p++, 0xFF); dv.setUint8(p++, 0x00);

  const out = new Uint8Array(buf);
  let dataPos = pixelDataOffset;

  for (let y = height - 1; y >= 0; y--) {
    let byte = 0, bitCount = 0;
    let rowPos = dataPos;
    for (let x = 0; x < width; x++) {
      const bit = bits[y * width + x] & 1;
      byte = (byte << 1) | bit;
      bitCount++;
      if (bitCount === 8) { out[rowPos++] = byte; byte = 0; bitCount = 0; }
    }
    if (bitCount !== 0) out[rowPos++] = byte << (8 - bitCount);
    while ((rowPos - dataPos) < rowBytesPadded) out[rowPos++] = 0x00;
    dataPos += rowBytesPadded;
  }

  return new Blob([buf], { type: "image/bmp" });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---------- Live preview (debounced) ----------
let previewTimer = null;
function schedulePreview() {
  if (previewTimer) clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { renderPreview().catch(e => setStatus(String(e.message ?? e), "err")); }, 50);
}

async function renderPreview() {
  setStatus("Rendering preview…", "muted");

  const { ch, size, fontSize, threshold, fontListStr, raster } = readParams();

  const workCanvas = document.getElementById("workCanvas");
  workCanvas.width = size;
  workCanvas.height = size;
  const wctx = workCanvas.getContext("2d", { willReadFrequently: true });

  // For live preview: use user's chain directly (fast), no probing.
  renderGlyphToCanvas(wctx, ch, size, fontSize, fontListStr, raster);

  const bits = thresholdCanvasToBitMatrix(wctx, size, threshold);
  drawPreview(bits, size, document.getElementById("previewCanvas"));

  setStatus(`Preview OK (${hexCodePoint(ch)}).`, "ok");
}

// ---------- Download (does best-effort font pick) ----------
async function downloadBMP() {
  setStatus("Preparing BMP…", "muted");

  const { ch, size, fontSize, threshold, fontListStr, raster } = readParams();

  const workCanvas = document.getElementById("workCanvas");
  workCanvas.width = size;
  workCanvas.height = size;
  const wctx = workCanvas.getContext("2d", { willReadFrequently: true });

  const { chosen, chain } = await pickFontFamilyChainForChar(wctx, ch, size, fontSize, fontListStr, raster);
  renderGlyphToCanvas(wctx, ch, size, fontSize, chain, raster);

  const bits = thresholdCanvasToBitMatrix(wctx, size, threshold);
  const blob = encodeBMP1bpp(bits, size, size);

  const fh = raster.flipH ? "H" : "nH";
  const fv = raster.flipV ? "V" : "nV";
  const filename = `char_${size}x${size}_${hexCodePoint(ch)}_w${raster.widthPct}_h${raster.heightPct}_r${raster.rotation}_${fh}_${fv}.bmp`;

  downloadBlob(blob, filename);
  setStatus(`Downloaded BMP using ${chosen}.`, "ok");
}

// ---------- Wire up events ----------
function addLiveListeners() {
  const sliders = [
    "sizeInput","fontSizeInput","thresholdInput",
    "widthPctInput","heightPctInput","offsetXInput","offsetYInput","rotationInput"
  ];
  for (const id of sliders) {
    document.getElementById(id).addEventListener("input", () => {
      if (id === "sizeInput") updateOffsetRanges();
      schedulePreview();
    });
  }

  document.getElementById("charInput").addEventListener("input", schedulePreview);
  document.getElementById("fontListInput").addEventListener("input", schedulePreview);
  document.getElementById("flipHInput").addEventListener("change", schedulePreview);
  document.getElementById("flipVInput").addEventListener("change", schedulePreview);

  document.getElementById("downloadBtn").addEventListener("click", () => {
    downloadBMP().catch(e => setStatus(String(e.message ?? e), "err"));
  });
}

updateOffsetRanges();
addLiveListeners();
renderPreview().catch(e => setStatus(String(e.message ?? e), "err"));
</script>
</body>
</html>
