<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uint8Array Binary Grid</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: white;
      color: #222;
    }

    #grid {
      display: grid;
      gap: 0;
      background: white;
      border: 1px solid #d9d9d9;
      width: max-content;
    }

    .cell {
      width: 90px;
      height: 32px;
      box-sizing: border-box;
      border-right: 1px solid #e6e6e6;
      border-bottom: 1px solid #e6e6e6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      font-family: monospace;
      font-size: 13px;
      color: #333;
      user-select: none;
      white-space: nowrap;
    }

    .cell:nth-child(1) {
      border-left: none;
    }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    function toBinary8(n) {
      return (n & 0xFF).toString(2).padStart(8, "0");
    }

    /**
     * Render a flat Uint8Array of length width * height
     */
    function renderBinaryGrid(container, data, width, height) {
      if (!(data instanceof Uint8Array)) {
        throw new TypeError("data must be a Uint8Array");
      }
      if (data.length !== width * height) {
        throw new Error(`Expected data.length = ${width * height}, got ${data.length}`);
      }

      container.innerHTML = "";
      container.style.gridTemplateColumns = `repeat(${width}, 90px)`;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index = y * width + x;
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.innerHTML = "<center>"
            //+ toBinary8(data[index]) + "<br>" 
            //+ data[index]+ " " 
            + (enu[data[index]]===undefined?"":enu[data[index]])
            + "</center>";
          container.appendChild(cell);
        }
      }
    }

    // Example: x * y grid
    const x = 8;
    const y = 9;
    const cols = [0,3,6];
    const enu = {0:".",1:"^",2:"T",4:"v",8:"< .",9:"< ^",12:"< v",26:"< T",64:"|",65:"| ^",66:"| T",68:"| v",128:"-",32:">",33:"^ \\",34:"T >",36:"v /"};


    var data = new Uint8Array(x*y);

    // HORIZONTALS
    for(var i=1;i<x;i++) data[i]           |= (1<<0);
    for(var i=1;i<x;i++) data[i+x*2]       |= (1<<1);
    for(var i=1;i<x;i++) data[i+x*(y-1)]   |= (1<<2);

    // VERTICALS
    for(var i=0;i<y;i++) data[i*x+1]       |= (1<<3);
    data[2*x+1] |= (1<<4);
    for(var i=0;i<y;i++) data[i*x+(x-1)]   |= (1<<5);

    for(var i=0;i<cols.length;i++)
      for(var j=0;j<y;j++) data[j*x+cols[i]] |= (1<<6);

    // CLEAR TABLE HEADER BAR
    for(var i=0;i<x;i++) data[i+x]     = (1<<7);

    const grid = document.getElementById("grid");
    renderBinaryGrid(grid, data, x, y);
  </script>
</body>
</html>
