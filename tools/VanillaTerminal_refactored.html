// --- configurable command registry ----------------------------------------
// All command behavior is declared here (preprocess -> compile -> run).
// You can override by passing { cliConfig: <yourConfig> } to new TERMINAL(...)

var term_cfg = 
{
  "shell":
  {
     "container_id":"vanilla-terminal"
    ,"boot_user":"terminal"
    ,"html": function(shell) 
  {
    return (
      '\n      <div class="container">\n' +
      "        <output></output>\n" +
      '        <div class="command">\n' +
      '          <div class="prompt">' +
      shell.name +
      shell.separator +
      "</div>\n" +
      '          <input class="input" spellcheck="false" autofocus />\n' +
      "        </div>\n" +
      "      </div>\n    "
    );
  }
  }
  ,
  "users":
  {
    "terminal":
    {
      "prompt_txt":
      {
        "welcome": document.getElementById("sbTitle").querySelector('big').textContent + " terminal - type <u>help</u>",
        "name": "myTerminal",
        "separator": '>',
        "parser": function(arg)
        {
          return __cliParseCmdArg(arg.statement);   // {"ok":(true/false),"err":(string),"name":(string),"args":(string)}
        }   
      }
      ,
      "data":{}
      ,
      "commands":
      {

        "help":
        {
          "description": "help summary",
          "usage": "help summary",
          "run": function(arg)
          {
            var cmds = Object.keys(this.oUser.commands || {}).sort();
            var tabspace = Math.max(...(cmds.map(el => el.length)));
            var lines = []; lines.push(this.h.escapeHtml(" <cmd> -h : detailed help"));
            for (var i=0;i<cmds.length;i++)
            {
              var description = this.oUser.commands[ cmds[i] ].description;
              lines.push( " " + cmds[i] + (description ? ("&nbsp;".repeat(tabspace - cmds[i].length) + ": " + this.h.escapeHtml( description )) : "") );
            }
            this.output( lines.join("<br>") );
          }
        },

        "clear":
        {
          "description": "clear terminal screen",
          "usage": "Usage:\n" +
              "<bare> - clear terminal screen\n" +
              " -h    - <command> help\n",
          "preprocess": function(arg)
          {
            arg.opt = (arg.rest || "").trim();
            return arg;
          },
          "run": function(arg)
          {
            var usage = "Usage:\n" +
              "<bare> - clear terminal screen\n" +
              " -h    - <command> help\n";

            if (arg.opt === "-h") { this.output(this.h.escapeHtml(usage)); return; }
            if (arg.opt === "")   { this.clear(); return; }

            this.output("[ERROR] " +this.h.escapeHtml(usage));
          }
        },

        "history":
        {
          "description": "show command history",
          "usage": "Usage:\n" +
              "<bare> - show command history\n" +
              " -c    - clear command history\n" +
              " -h    - <command> help\n",
          "preprocess": function(arg)
          {
            arg.opt = (arg.rest || "").trim();
            return arg;
          },
          "run": function(arg)
          {
            var usage = "Usage:\n" +
              "<bare> - show command history\n" +
              " -c    - clear command history\n" +
              " -h    - <command> help\n";

            if (arg.opt === "-h") { this.output(escapeHtml(usage)); return; }

            if (arg.opt === "")
            {
              if (!this.history || this.history.length === 0) { this.output("(history empty)"); return; }
              var lines = this.history
                .map((h, i) => String(i + 1) + ": " + this.h.escapeHtml(h))
                .join("<br>");
              this.output(lines);
              return;
            }

            if (arg.opt === "-c")
            {
              try { window.localStorage.removeItem(this.cfg.STORAGE_KEY); } catch (_) {}
              this.history = [];
              this.historyCursor = 0;
              this.output("History cleared");
              return;
            }

            this.output("[ERROR] " +this.h.escapeHtml(usage));
          }
        },

        "script":
        {
          "description": "enter script mode",
          "usage": "enter script mode",
          "run": function(arg)
          {
            if ((arg.rest || "").trim()) { this.output("[ERROR] Usage: script"); return; }
            this.cliMode = "script"; // obsolete
            this.setUser("script");
            this.updatePrompt();   //  this.cfg.scriptPrompt -> this.user.name
             this.output(sbTitle.querySelector('big').textContent + " script - type <u>help()</u>");
          }
        },

        "exec":
        {
          "description": "run script from a string",
          "usage": "run script from a string",
          "preprocess": function(arg)
          {

            var usage = "Usage:\n" +
              "\"<string>\" - execute string as script\n" +
              " -h        - <command> help\n";

            arg.usage = usage;
            arg.opt = (arg.rest || "").trim();

            if (arg.opt === "-h") return arg;

            var parsed = __cliParseExecArg(arg.rest, usage);
            if (!parsed.ok) return { ok:false, err:"[PARSE ERROR] " + parsed.err };

            arg.scriptSource = parsed.value;
            return arg;


          },
          "compile": function(arg)
          {
            if (arg.opt === "-h") return arg;

            var compiled = this.cliCompileScriptLine(arg.scriptSource);
            if (!compiled.ok) return { ok:false, err:"[COMPILE ERROR] " + compiled.err };

            arg.ops = compiled.value;
            return arg;
          },
          "run": function(arg)
          {
            if (arg.opt === "-h") { this.output(escapeHtml(arg.usage)); return; }

            try {
              this.cliRunScriptOps(arg.ops);
              this.output("[OK] exec() completed");
            } catch (e) {
              this.output("[RUN ERROR] " +this.h.escapeHtml(e && e.message ? e.message : String(e)));
            }
          }
        },

        "exit":
        {
          "description": "exit CLI",
          "usage": "exit CLI",
          "run": function(arg)
          {
            // Keep simple: reset to terminal mode and show message.
            this.cliMode = "terminal";
            this.updatePrompt(this.cfg.prompt);
            this.output("Exited CLI.");
          }
        }
      }
    }

    ,

    "script":
    {
      "prompt_txt":
      {
        "welcome": document.getElementById("sbTitle").querySelector('big').textContent + " script - type <u>help</u>",
        "name": "myScript",
        "separator": '>',
        "parser": function(arg)
        {
          return __cliParseJSStatement(arg.statement); // {"ok":(true/false),"name":(string),"args":"(string)"}
        }  
      }
      ,
      "commands":
      {
        "exit":
        {
          "description": "",
          "usage": "",
          "run": function(arg)
          {
            this.setUser("terminal");
            this.cliMode = "terminal";
            this.updatePrompt(this.cfg.prompt);
            this.output("Exited " + this.user.name + " mode.");
          }
        }
        ,
        "help":
        { 
          "description": "",
          "usage": "",
          "preprocess": function(arg)
          {
            if (arg.args.length > 1) return { ok:false, err:'Usage: help() or help("topic")' };
            arg.topic = arg.args.length ? arg.args[0] : "";
            return arg;
          },
          "run": function(arg)
          {
            var lines = [];
            lines.push("commands:");
            lines.push(' exec("..") - run ' + this.cfg.prompt + ' command');
            lines.push(' eval("..") - evaluate javascript');
            lines.push(' exit()       - return to ' + this.cfg.prompt);
            this.output(this.h.escapeHtml(lines.join("\n")));
          }
        }
        ,
        "exec":
        {
          "description": "",
          "usage": "",
          "preprocess": function(arg)
          {
            if (arg.args.length !== 1) return { ok:false, err:'Usage: exec("..")' };
            if (typeof arg.args[0] !== "string") return { ok:false, err:'Usage: exec("..")' };

            var cmdLine = this.cliNormalizeQuotes(arg.args[0]).trim();
            if (!cmdLine) return { ok:false, err:'Usage: exec("..")' };
            if (/[;\r\n]/.test(cmdLine)) return { ok:false, err:"exec() accepts only one terminal command (no ';' or newlines)" };

            arg.cmdLine = cmdLine;
            return arg;
          },
          "run": function(arg)
          {
            this.cliExecuteTerminalLine(arg.cmdLine);
          }
        }
        ,
        "eval":
        {
          "description": "",
          "usage": "",
          "preprocess": function(arg)
          {
            if (arg.args.length !== 1) return { ok:false, err:'Usage: eval("..")' };
            if (typeof arg.args[0] !== "string") return { ok:false, err:'Usage: eval("..")' };
            arg.expression = this.cliNormalizeQuotes(arg.args[0]).trim();
            if (!arg.expression) return { ok:false, err:'Usage: eval("..")' };
            return arg;
          },
          "run": function(arg)
          {
            eval(arg.expression);
          }
        }
      }
    }
  }
}

}
,
term_cfg);

function TERMINAL(cfg,newcfg) 
{

  // ---- load new config --------------------------------------------------------------
  this.newcfg = newcfg || {/* stand-in config when totally blank */};
  this.shell        = newcfg.shell || {"container_id": "vanilla-terminal", "boot_user": "terminal"}

  //this.container_id = newcfg.general.container || "vanilla-terminal";  // get HTML container element id
  this.user         = this.shell.boot_user || "terminal";              // set user at boot time
  this.setUser = function(name)
  {
    this.user = name;
    this.oUser        = this.newcfg.users[ name ];                       // link to another user object
    //this.commands     = this.newcfg.users[ name ].commands;              // get user commands
    //this.prompt_txt   = this.newcfg.users[ name ].prompt_txt;            // get user prompt text
    //this.data         = this.newcfg.users[ name ].data;                  // get user data
  }
  this.setUser(this.user);

  // ---- load old config --------------------------------------------------------------

  cfg = cfg || {/* stand-in config ? */};
  this.cfg = cfg;
  var userCommands = cfg.commands || {};
  var welcome = cfg.welcome !== undefined ? cfg.welcome : 'Welcome to <a href="">Vanilla</a> terminal.';
  var prompt = cfg.prompt || "";
  var separator = cfg.separator || "&gt;";

  // ---- constants -----------------------------------------------------------
  
  if(cfg.STORAGE_KEY==null)  cfg.STORAGE_KEY = "VanillaTerm";
  if(cfg.ROOT_CLASS==null)  cfg.ROOT_CLASS = "VanillaTerm";


  // ---- generic helpers -----------------------------------------------------

  function escapeHtml(str) 
  {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

   this.h = 
   {
    "escapeHtml": function(str) 
      {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
   }

  // ---- specific helpers ----------------------------------------------------

  function promptHTML(shell) 
  {
    return (
      '\n      <div class="container">\n' +
      "        <output></output>\n" +
      '        <div class="command">\n' +

// --- helpers ---------------------------------------------------------------





function __cliNormalizeQuotes(s) 
{
  return String(s || "")
    .replace(/[‘’‚‛]/g, "'")
    .replace(/[“”„‟]/g, '"');
}

function __cliSplitDelimited(src, delimiter, { keepEmpty = false } = {})
{
  const out = [];
  let cur = "";
  let q = null;
  let esc = false;

  for (let i = 0; i < src.length; i++)
  {
    const ch = src[i];

    if (esc) { cur += ch; esc = false; continue; }
    if (ch === "\\") { cur += ch; esc = true; continue; }
    if (q) { cur += ch; if (ch === q) q = null; continue; }
    if (ch === "'" || ch === '"') { q = ch; cur += ch; continue; }

    if (ch === delimiter)
    {
      const t = cur.trim();
      if (keepEmpty || t !== "") out.push(t);
      cur = ""; continue;
    }

    cur += ch;
  }

  const t = cur.trim();
  if (keepEmpty || t !== "") out.push(t);
  return out;
}

function __cliParseStringLiteral(tok) {
  tok = tok.trim();
  if (tok.length < 2) return null;

  const q = tok[0];
  if ((q !== "'" && q !== '"') || tok[tok.length - 1] !== q) return null;

  let inner = tok.slice(1, -1);

  // Minimal unescape support
  inner = inner.replaceAll("\\n", "\n").replaceAll("\\r", "\r").replaceAll("\\t", "\t");
  inner = inner.replaceAll("\\\"", '"').replaceAll("\\'", "'").replaceAll("\\\\", "\\");
  return inner;
}

function __cliParseExecArg(rest, usage) 
{
  // rest may be: ("...") or ('...') with optional whitespace
  let s = rest.trim();
  // Allow a trailing semicolon: exec("...");
  if (s.endsWith(";")) s = s.slice(0, -1).trim();
  if (!s) return { ok: false, err: usage };

  if (s.startsWith("\"")) {
    if (!s.endsWith("\"")) return { ok: false, err: usage };
    //s = s.slice(1, -1).trim();
  }

  const lit = __cliParseStringLiteral(s);
  if (lit === null) return { ok: false, err: usage };

  return { ok: true, value: lit };
}

function __cliParseJSStatement(stmt) 
{
  const m = stmt.match(/^([A-Za-z_]\w*)\s*\((.*)\)\s*$/);
  if (!m) return { ok: false, err: "Invalid myScript syntax: " + stmt };

  const name = m[1];
  const argStr = (m[2] || "").trim();
  const rawArgs = argStr ? __cliSplitDelimited(argStr, ",", { keepEmpty: false }) : [];

  const args = [];
  for (const a of rawArgs) {
    if (a === "") continue;

    const lit = __cliParseStringLiteral(a);
    if (lit !== null) {
      args.push(lit);
      continue;
    }

    const n = Number(a);
    if (!Number.isNaN(n) && /^[+-]?(?:\d+\.?\d*|\d*\.?\d+)$/.test(a)) {
      args.push(n);
      continue;
    }

    // Bare words are not allowed in myScript
    return { ok: false, err: "Invalid argument: " + a };
  }

  return { ok: true, value: { name, args } };
}




  function cloneCommandNode(commandEl) {
    var line = commandEl.cloneNode(true);
    var input = line.querySelector(".input");

    input.autofocus = false;
    input.readOnly = true;
    input.insertAdjacentHTML("beforebegin", escapeHtml(input.value));
    input.parentNode.removeChild(input);

    line.classList.add("line");
    return line;
  }

  function loadHistory() {
    try {
      var raw = window.localStorage.getItem(oTERM.cfg.STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (_) {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      window.localStorage.setItem(oTERM.cfg.STORAGE_KEY, JSON.stringify(history));
    } catch (_) {
      // ignore quota / privacy mode errors
    }
  }

  // ---- instance state ------------------------------------------------------

  var builtins =
    window.VanillaTerminalBuiltins &&
    typeof window.VanillaTerminalBuiltins.createBuiltInCommands === "function"
      ? window.VanillaTerminalBuiltins.createBuiltInCommands()
      : {};

  //this.commands = Object.assign({}, userCommands, builtins);

  this.history = loadHistory();
  this.historyCursor = this.history.length;

  //this.shell = { prompt: prompt, separator: separator };

  this.state = {
    prompt: false, // prompt mode = next ENTER answers a question
    idle: false,
  };

  this.onAskCallback = function () {};
  this.onInputCallback = null;

  // ---- DOM -----------------------------------------------------------------

  var root = document.getElementById(this.shell.container_id);
  if (!root) {
    throw new Error("Container #" + this.shell.container_id + " doesn't exists.");
  }

  // Cache DOM
  root.classList.add(this.cfg.ROOT_CLASS);
  root.insertAdjacentHTML("beforeEnd", this.shell.html(this.oUser.prompt_txt) );

  var container = root.querySelector(".container");
  this.DOM = 
  {
    root: root,
    container: container,
    output: container.querySelector("output"),
    command: container.querySelector(".command"),
    input: container.querySelector(".command .input"),
    prompt: container.querySelector(".command .prompt"),
  };

  // ---- internal methods that need `this` -----------------------------------

  var self = this;

  function resetCommand() 
  {
    self.DOM.input.value = "";
    self.DOM.command.classList.remove("input");
    self.DOM.command.classList.remove("hidden");

    if (typeof self.DOM.input.scrollIntoView === "function") {
      self.DOM.input.scrollIntoView({ block: "nearest" });
    }
  }

  function handleKeyUp(event) 
  {
    var key = event.key || "";
    var code = event.keyCode;

    if (key === "Escape" || code === 27) {
      self.DOM.input.value = "";
      event.stopPropagation();
      event.preventDefault();
      return;
    }

    var isUp = key === "ArrowUp" || code === 38;
    var isDown = key === "ArrowDown" || code === 40;
    if (!isUp && !isDown) return;

    if (isUp && self.historyCursor > 0) self.historyCursor -= 1;
    if (isDown && self.historyCursor < self.history.length - 1) self.historyCursor += 1;

    var value = self.history[self.historyCursor];
    if (value !== undefined) self.DOM.input.value = value;
  }

  function handleKeyDown(event) 
  {
    var key = event.key || "";
    var code = event.keyCode;

    var isEnter = key === "Enter" || code === 13;
    if (!isEnter) return;

    var commandLine = self.DOM.input.value.trim();
    if (!commandLine) return;

    // Prompt mode: answer a question instead of dispatching a command
    if (self.state.prompt) {
      self.state.prompt = false;
      self.onAskCallback(commandLine);
      self.updatePrompt(); // restore normal prompt
      resetCommand();
      return;
    }

    // Save in history
    self.history.push(commandLine);
    saveHistory(self.history);
    self.historyCursor = self.history.length;

    // Echo command as output line
    self.DOM.output.appendChild(cloneCommandNode(self.DOM.command));

    // Hide live command line while processing
    self.DOM.command.classList.add("hidden");
    self.DOM.input.value = "";

    // Pre-dispatch hook: allow host to handle the raw line.
    var parts = commandLine.split(" ");
    var command = parts[0];
    var params = parts.slice(1);


    if (typeof self.onInputCallback === "function") {
      try {
        var handled = self.onInputCallback(command, params, commandLine);
        if (handled === true) {
          resetCommand();
          return;
        }
      } catch (err) {
        self.output("[ERROR] " + escapeHtml(err && err.message ? err.message : String(err)));
        resetCommand();
        return;
      }
    }

    // Dispatch (built-ins / user commands)
    var callback = self.oUser.commands[command];

    if (typeof callback === "function") {
      callback(self, params);
    } else {
      self.output("<u>" + escapeHtml(command) + "</u>: command not found.");
    }
  }

  // ---- public API (instance methods defined here) ---------------------------

  this.clear = function () {
    self.DOM.output.innerHTML = "";
    resetCommand();
  };

  this.idle = function () {
    self.state.idle = true;
    self.DOM.command.classList.add("idle");
    self.DOM.prompt.innerHTML = '<div class="spinner"></div>';
  };

  this.prompt = function (question, callback) {
    self.state.prompt = true;
    self.onAskCallback = typeof callback === "function" ? callback : function () {};

    self.DOM.prompt.innerHTML = String(question) + ":";
    resetCommand();
    self.DOM.command.classList.add("input");
  };

  this.onInput = function (callback) {
    self.onInputCallback = callback;
  };

  this.output = function (html) {
    if (html === undefined) html = "&nbsp;";
    self.DOM.output.insertAdjacentHTML("beforeEnd", "<span>" + html + "</span>");
    resetCommand();
  };

  /*
  this.updatePrompt = function (newPrompt) 
  {
    if (newPrompt === undefined) newPrompt = self.shell.prompt;

    self.shell = { prompt: newPrompt, separator: self.shell.separator };
    self.state.idle = false;

    self.DOM.command.classList.remove("idle");
    self.DOM.prompt.innerHTML = String(newPrompt) + self.shell.separator;
    self.DOM.input.focus();
  };
  */

  this.updatePrompt = function () 
  {


    // obsolete ?
    //if (newPrompt === undefined) newPrompt = self.shell.prompt;
    //self.shell = { prompt: newPrompt, separator: self.shell.separator };
    self.state.idle = false;

    self.DOM.command.classList.remove("idle");
    self.DOM.prompt.innerHTML = String(this.oUser.prompt_txt.name) + this.oUser.prompt_txt.separator
    self.DOM.input.focus();
  };


  // ---- CLI methods (instance-scoped) -----------------------------------

  this.cliMode = "terminal"; // "terminal" | "script"
  this.cliConfig = cfg.cliConfig || term_cfg;

  this.cliNormalizeQuotes = function(s)
  {
    return String(s || "")
      .replace(/[‘’‚‛]/g, "'")
      .replace(/[“”„‟]/g, '"');
  };

  this.cliHandleLine = function(line)
  {
    // TODO take advantage of this.newcfg
    if (self.cliMode === "terminal") return self.cliExecuteTerminalLine(line);
    if (self.cliMode === "script")   return self.cliHandleScript(line);

    self.output("[ERROR] Unknown CLI mode");
    return true;
  };

  this.cliExecuteTerminalLine = function(line)
  {
    var m = String(line || "").match(/^([A-Za-z_]\w*)\s*(.*)$/);
    if (!m) { self.output("[ERROR] Invalid command"); return true; }

    var cmd = String(m[1] || "").toLowerCase();
    var rest = String(m[2] || "").trim();

    //var defs = (self.cliConfig && self.cliConfig.users.terminal.commands) ? self.cliConfig.users.terminal.commands : {};
    //var def  = defs[cmd];
    var def = this.oUser.commands[cmd];

    if (!def)
    {
      if (line.indexOf("(") >= 0 && line.trim().endsWith(")"))
      {
        self.output('[ERROR] myScript syntax detected. Type <u>script</u> to enter myScript mode, or use <u>exec("...")</u>');
        return true;
      }

      self.output('[ERROR] Unknown command. Type <u>help</u>');
      return true;
    }

    var arg = { ok: true, mode: "terminal", cmd: cmd, rest: rest, line: line };

    if (typeof def.preprocess === "function")
    {
      var r = def.preprocess.call(self, arg);
      if (r && r.ok === false) { self.output("[ERROR] " + escapeHtml(r.err || "")); return true; }
      if (r) arg = r;
    }

    if (typeof def.compile === "function")
    {
      var c = def.compile.call(self, arg);
      if (c && c.ok === false) { self.output("[ERROR] " + escapeHtml(c.err || "")); return true; }
      if (c) arg = c;
    }

    if (typeof def.run === "function")
    {
      def.run.call(self, arg);
      return true;
    }

    self.output("[ERROR] Command has no run() handler: " + escapeHtml(cmd));
    return true;
  };

  this.cliCompileScriptLine = function(line)
  {
    var s = self.cliNormalizeQuotes(line);
    var statements = __cliSplitDelimited(s, ";", { keepEmpty: false });
    if (!statements.length) return { ok: true, value: [] };

    //var defs = (self.cliConfig && self.cliConfig.users.script) ? self.cliConfig.users.script.commands : {};

    var ops = [];

    for (var i=0;i<statements.length;i++)
    {
      var st = statements[i];
      var parsed = __cliParseJSStatement(st);
      if (!parsed.ok) return parsed;

      var name = parsed.value.name;
      var args = parsed.value.args;
      var lname = String(name || "").toLowerCase();     // make commands case-insensitive

      var def = this.oUser.commands[lname];
      if (!def) return { ok: false, err: "Unknown " + this.oUser.prompt_txt.name + " function: " + name + "()" };

      var a = { ok: true, mode: "script", name: name, cmd: lname, args: args, raw: st };

      if (typeof def.preprocess === "function")
      {
        var r = def.preprocess.call(self, a);
        if (r && r.ok === false) return r;
        if (r) a = r;
      }

      var op = null;
      if (typeof def.compile === "function")
      {
        op = def.compile.call(self, a);
        if (op && op.ok === false) return op;
      }

      if (!op) op = { type: lname };
      if (!op.type) op.type = lname;

      ops.push(op);
    }

    return { ok: true, value: ops };
  };

  this.cliRunScriptOps = function(ops)
  {
    //var defs = (self.cliConfig && self.cliConfig.users.script.commands) ? self.cliConfig.users.script.commands : {};


    for (var i=0;i<ops.length;i++)
    {
      var op = ops[i] || {};
      var type = String(op.type || "").toLowerCase();
      //var def = defs[type];
      var def = this.oUser.commands[type];

      if (!def || typeof def.run !== "function")
      {
        self.output("[ERROR] Internal: unknown op " + escapeHtml(type));
        continue;
      }

      def.run.call(self, op);
    }
  };

  this.cliHandleScript = function(line)
  {
    if (/^[A-Za-z_]\w*$/.test(line))
    {
      self.output('[ERROR] Script mode expects function calls, e.g. <u>help()</u>');
      return true;
    }

    var compiled = self.cliCompileScriptLine(line);
    if (!compiled.ok)
    {
      self.output("[ERROR] " + escapeHtml(compiled.err));
      return true;
    }

    try
    {
      self.cliRunScriptOps(compiled.value);
    }
    catch (e)
    {
      self.output("[ERROR] " + escapeHtml(e && e.message ? e.message : String(e)));
    }

    return true;
  };


  // ---- listeners -----------------------------------------------------------

  // Auto-scroll when new output is appended.
  var observer = new MutationObserver(function () 
  {
    setTimeout(function () {
      self.DOM.input.scrollIntoView({ block: "nearest" });
    }, 0);
  });
  observer.observe(self.DOM.output, { childList: true, subtree: true });

  // Focus handling: focus the input when clicking inside the terminal,
  // but do NOT steal focus when selecting/copying text in the output.
  self.DOM.root.addEventListener(
    "click",
    function (ev) {
      // Ignore clicks outside the terminal root
      if (!self.DOM.root.contains(ev.target)) return;
      // Don't steal focus when the user is interacting with the output area (selection/copy)
      if (self.DOM.output.contains(ev.target)) return;
      self.DOM.input.focus();
    },
    false
  );

  self.DOM.command.addEventListener(
    "click",
    function () {
      self.DOM.input.focus();
    },
    false
  );

  self.DOM.input.addEventListener("keyup", handleKeyUp, false);
  self.DOM.input.addEventListener("keydown", handleKeyDown, false);

  // ---- initial output ------------------------------------------------------

  if (welcome) this.output(welcome);
};
