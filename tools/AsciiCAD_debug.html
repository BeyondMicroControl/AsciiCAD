    <meta charset="utf-8" />

    <title>AsciiCAD debug</title>

    <style>
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.topbar{
  height: 40px;
  flex: 0 0 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: #ddd;
  background: #1b1b1b;
  border-bottom: 1px solid #2a2a2a;
  box-sizing: border-box;
}

.frame{
  flex: 1 1 auto;
  width: 100%;
  border: 0;
  display: block;
  background: #fff;
}

/* --- Splitter handle --- */
#splitter{
  flex: 0 0 6px;
  height: 6px;
  cursor: row-resize;
  background: #111827;
  border-top: 1px solid #334155;
  border-bottom: 1px solid #334155;
  box-sizing: border-box;
}

/* --- Resizable log panel --- */
#logPanel{
  flex: 0 0 auto;         /* no longer locked to 140px */
  height: 140px;          /* default; JS will override if stored */
  min-height: 60px;       /* prevent collapsing */
  max-height: 70vh;       /* keep room for the iframe */
  overflow-y: auto;
  overflow-x: hidden;
  background: #0f172a;
  color: #e5e7eb;
  font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: 6px;
  margin: 0;
  border-top: 0;          /* border handled by splitter */
  box-sizing: border-box;
  white-space: pre-wrap;
  scrollbar-color: #808080 #222;
}

a:link {
  color: grey;
  background-color: transparent;
  text-decoration: none;
}

a:visited {
  color: pink;
  background-color: transparent;
  text-decoration: none;
}

a:hover {
  color: red;
  background-color: transparent;
  text-decoration: underline;
}

a:active {
  color: yellow;
  background-color: transparent;
  text-decoration: underline;
}

    </style>
  </head>

<div id="splitter" title="Drag to resize logs"></div>
<div id="logPanel"></div>


<script>

const baseURL = "AsciiCAD.html";
const iframe = document.getElementById("app");
const logPanel = document.getElementById("logPanel");

// FORCE readable colors even if CSS is overridden
logPanel.style.background = "#0f172a";
logPanel.style.color = "#e5e7eb";
logPanel.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
logPanel.style.fontSize = "12px";







const splitter = document.getElementById("splitter");

// Restore saved height (if any)
(function restoreLogHeight(){
  try {
    const h = parseInt(localStorage.getItem("AsciiCAD_debug_logHeight") || "", 10);
    if (!isNaN(h) && h > 0) logPanel.style.height = h + "px";
  } catch(_) {}
})();

(function enableLogResize(){
  let dragging = false;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  splitter.addEventListener("pointerdown", (ev) => {
    dragging = true;
    splitter.setPointerCapture(ev.pointerId);
    document.body.style.cursor = "row-resize";
    document.body.style.userSelect = "none";
  });

  splitter.addEventListener("pointermove", (ev) => {
    if (!dragging) return;

    // We resize by setting the logPanel height to the distance from bottom
    const viewportH = window.innerHeight;
    const desired = viewportH - ev.clientY;

    const minH = 60;
    const maxH = Math.floor(viewportH * 0.7);

    const h = clamp(desired, minH, maxH);
    logPanel.style.height = h + "px";

    try { localStorage.setItem("AsciiCAD_debug_logHeight", String(h)); } catch(_) {}
  });

  function endDrag(){
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  }

  splitter.addEventListener("pointerup", endDrag);
  splitter.addEventListener("pointercancel", endDrag);

  // Ensure it stays reasonable on resize/orientation change
  window.addEventListener("resize", () => {
    const current = parseInt(logPanel.style.height || "140", 10);
    const maxH = Math.floor(window.innerHeight * 0.7);
    if (current > maxH) {
      logPanel.style.height = maxH + "px";
      try { localStorage.setItem("AsciiCAD_debug_logHeight", String(maxH)); } catch(_) {}
    }
  });
})();





window.addEventListener("message", (e) => {
if (!e.data || !e.data.__asciicadLog) return;

const line = document.createElement("div");
line.style.whiteSpace = "pre-wrap";
line.style.color =
    e.data.type === "error" ? "#f87171" :
    e.data.type === "warn"  ? "#fde047" : "#e5e7eb";

line.textContent = `[${e.data.type}] ${(e.data.args || []).join(" ")}`;
logPanel.appendChild(line);

// Most reliable autoscroll:
line.scrollIntoView({ block: "end" });
});
</script>
